<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Irshad Ltd. Investor Game</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Source+Serif+4:opsz,wght@8..60,500;8..60,600;8..60,700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one phone-width column, one step per screen; the role colour (public orange / private taupe, from the deck) drives every accent */
:root{
  --bg:#ffffff; --surface:#f3f1ee; --line:#e4dfd9; --fg:#1c1917; --muted:#6e6660;
  --pub:#d24a1a; --pub-soft:#fbebe3; --priv:#8a6f49; --priv-soft:#f2ece2;
  --up:#1e8449; --down:#c0392b; --on-accent:#ffffff; --card-back:#2a2420; --card-line:#4a3f37;
  --display:"Source Serif 4", Georgia, "Times New Roman", serif;
  --body:"IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace;
  --role:var(--pub); --role-soft:var(--pub-soft);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141210; --surface:#1f1c19; --line:#332e2a; --fg:#f1ece6; --muted:#a39a91;
    --pub:#f0703f; --pub-soft:#3a2219; --priv:#c9ad82; --priv-soft:#2e271d;
    --up:#46c07a; --down:#ff6a55; --on-accent:#1a1310; --card-back:#2b2520; --card-line:#4d4239;
    --role:var(--pub); --role-soft:var(--pub-soft); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141210; --surface:#1f1c19; --line:#332e2a; --fg:#f1ece6; --muted:#a39a91;
  --pub:#f0703f; --pub-soft:#3a2219; --priv:#c9ad82; --priv-soft:#2e271d;
  --up:#46c07a; --down:#ff6a55; --on-accent:#1a1310; --card-back:#2b2520; --card-line:#4d4239;
  --role:var(--pub); --role-soft:var(--pub-soft); color-scheme:dark;
}
body[data-role="private"]{ --role:var(--priv); --role-soft:var(--priv-soft); }

html,body{height:100%}
[hidden]{display:none!important}
body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
.app{max-width:460px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 28px}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-block:6px 12px;border-bottom:1px solid var(--line)}
.brand{font:600 15px var(--display);letter-spacing:.01em}
.brand span{color:var(--muted);font:500 11px var(--mono);letter-spacing:.06em;margin-left:6px}
.pill{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;padding:4px 9px;border-radius:999px;background:var(--role-soft);color:var(--role);display:inline-flex;align-items:center;gap:5px}
.pill svg{width:12px;height:12px}

.screen{display:flex;flex-direction:column;gap:18px;padding-top:22px;animation:rise .35s ease both}
@keyframes rise{from{opacity:.4;transform:translateY(6px)}to{opacity:1;transform:none}}
.eyebrow{font:500 11px var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--role)}
h1{font:600 1.85rem/1.15 var(--display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font:600 1.15rem/1.25 var(--display);margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:0;max-width:60ch}
.stack{display:flex;flex-direction:column;gap:8px}
.label{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* buttons */
.btn{position:relative;z-index:1;-webkit-appearance:none;appearance:none;border:0;border-radius:12px;padding:15px 18px;font:600 15px var(--body);cursor:pointer;width:100%;display:flex;align-items:center;justify-content:center;gap:8px;transition:transform .12s, opacity .2s}
.btn:active{transform:scale(.98)}
.btn:focus-visible{outline:3px solid var(--role);outline-offset:3px}
.btn-primary{background:var(--role);color:var(--on-accent)}
.btn-ghost{background:transparent;color:var(--fg);border:1.5px solid var(--line)}
.btn[disabled]{cursor:not-allowed;opacity:.55}
.btn svg{width:17px;height:17px}
.btn small{font-weight:400;opacity:.8}
.choices{display:grid;gap:10px;margin-top:4px}

/* investor card */
.deck{perspective:1100px;width:min(100%, 300px, 50vh);width:min(100%, 300px, 50svh);aspect-ratio:4/5;max-width:100%;margin-inline:auto;isolation:isolate}
/* after the flip, drop the 3D layers so Safari repaints the page normally */
.deck.flipped.settled .card{transform:none;transition:none;transform-style:flat}
.deck.settled .back{display:none}
.deck.flipped.settled .front{transform:none}
/* the main action stays pinned to the bottom of the screen on small phones */
.cta{position:-webkit-sticky;position:sticky;bottom:0;z-index:5;display:grid;gap:10px;padding-top:16px;padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px));background:linear-gradient(to bottom, transparent, var(--bg) 16px)}
.card{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .9s cubic-bezier(.3,.7,.2,1)}
.deck.flipped .card{transform:rotateY(180deg)}
.face{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;overflow:hidden}
.back{background:var(--card-back);display:grid;place-items:center;
  background-image:repeating-linear-gradient(45deg,var(--card-line) 0 1px,transparent 1px 14px),repeating-linear-gradient(-45deg,var(--card-line) 0 1px,transparent 1px 14px)}
.back-mark{background:var(--card-back);color:#e9e1d8;border:1px solid var(--card-line);border-radius:12px;padding:16px 20px;text-align:center}
.back-mark b{display:block;font:600 1.4rem var(--display)}
.back-mark span{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;opacity:.7}
.front{transform:rotateY(180deg);background:var(--role);color:var(--on-accent);padding:22px;display:flex;flex-direction:column;justify-content:space-between}
.front .kind{font:500 11px var(--mono);letter-spacing:.14em;text-transform:uppercase;opacity:.85}
.front .who{font:700 1.9rem/1.02 var(--display);margin-top:8px}
.front .sub{opacity:.9;margin-top:6px;font-size:14px}
.front .cash{font:600 2.4rem/1 var(--display);font-variant-numeric:tabular-nums}
.front .odds{display:flex;gap:5px;margin-top:10px}
.front .odds i{width:22px;height:30px;border-radius:4px;border:1.5px solid currentColor;opacity:.45}
.front .odds i.me{background:currentColor;opacity:1}
.front .foot{font-size:12.5px;opacity:.85;margin-top:6px}
.locked-note{display:flex;gap:8px;align-items:center;font-size:13px;color:var(--muted);justify-content:center}
.locked-note svg{width:14px;height:14px}

/* company header */
.co{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.co h1{font-size:1.7rem}
.co .meta{font:500 12px var(--mono);color:var(--muted);margin-top:2px}
.quote{text-align:right;min-width:0}
.quote .px{font:600 1.7rem/1 var(--mono);font-variant-numeric:tabular-nums;transition:color .25s}
.quote .chg{font:500 12px var(--mono)}
.px.flash-up{color:var(--up)} .px.flash-down{color:var(--down)}
.up{color:var(--up)} .down{color:var(--down)}
.spark{width:100%;height:56px;display:block}

/* market trait chips */
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;gap:9px;align-items:center;background:var(--role-soft);border-radius:10px;padding:10px 11px;font-size:13px;font-weight:500;line-height:1.25;min-width:0}
.chip svg{width:18px;height:18px;color:var(--role);flex:none}

/* rows */
.rows{border-top:1px solid var(--line)}
.row{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.row b{font:500 14px var(--mono);font-variant-numeric:tabular-nums}
.redact{display:inline-block;height:12px;border-radius:3px;background:var(--fg);opacity:.82}
.lockline{display:flex;align-items:center;gap:7px;font-size:12.5px;color:var(--muted)}
.lockline svg{width:14px;height:14px;color:var(--role)}

/* whispers */
.whispers{display:flex;flex-direction:column;gap:8px}
.bubble{background:var(--surface);border-radius:14px 14px 14px 4px;padding:9px 12px;font-size:14px;max-width:90%;animation:pop .4s ease both}
.bubble .from{display:block;font:500 10.5px var(--mono);letter-spacing:.06em;text-transform:uppercase;color:var(--role);margin-bottom:2px}
@keyframes pop{from{opacity:0;transform:translateY(8px) scale(.97)}to{opacity:1;transform:none}}

/* simulation */
.big{font:600 2.7rem/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.bigrow{display:flex;align-items:baseline;justify-content:space-between;gap:10px;flex-wrap:wrap}
.delta{font:500 15px var(--mono);font-variant-numeric:tabular-nums}
.clock{font:500 12px var(--mono);color:var(--muted)}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
.ln{fill:none;stroke:var(--role);stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ln.guess{stroke-dasharray:4 6;stroke-width:2;opacity:.75}
.ln-priv{fill:none;stroke:var(--priv);stroke-width:2.6;stroke-linejoin:round;stroke-linecap:round}
.ln-pub{fill:none;stroke:var(--pub);stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.area{fill:var(--role);opacity:.1}
.base{stroke:var(--muted);stroke-width:1;stroke-dasharray:2 4;fill:none}
.axis{stroke:var(--line);stroke-width:1}
.lbl{fill:var(--muted);font:500 10.5px var(--mono)}
.lbl-strong{fill:var(--fg);font:600 12px var(--mono)}
.dot{fill:var(--role);stroke:var(--bg);stroke-width:2}
.dot-priv{fill:var(--priv);stroke:var(--bg);stroke-width:2}
.dot-pub{fill:var(--pub);stroke:var(--bg);stroke-width:2}
.ring{fill:var(--bg);stroke:var(--muted);stroke-width:1.5;stroke-dasharray:2 2}
.zone-priv{fill:var(--priv);opacity:.1}
.zone-pub{fill:var(--pub);opacity:.1}
.zone-lbl-priv{fill:var(--priv);font:600 10.5px var(--mono);letter-spacing:.06em}
.zone-lbl-pub{fill:var(--pub);font:600 10.5px var(--mono);letter-spacing:.06em}
.gain-priv{fill:var(--priv);font:700 20px var(--display)}
.gain-pub{fill:var(--pub);font:700 20px var(--display)}
.events{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.events li{display:grid;grid-template-columns:62px 1fr;gap:10px;font-size:14px;animation:pop .4s ease both;align-items:baseline}
.events li span{font:500 11px var(--mono);color:var(--role);letter-spacing:.04em}

/* result */
.result-card{background:var(--role-soft);border-radius:16px;padding:22px;display:flex;flex-direction:column;gap:10px}
.result-card .big{font-size:3rem}
.fromto{font:500 13px var(--mono);color:var(--muted)}
.verdict{font:600 1.15rem/1.3 var(--display);margin:0;text-wrap:balance}

/* reveal */
.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:104px 1fr 58px;align-items:center;gap:10px;font-size:13px}
.track{height:16px;background:var(--surface);border-radius:8px;overflow:hidden}
.fill{height:100%;width:0;border-radius:8px;transition:width 1.1s cubic-bezier(.3,.7,.2,1)}
.bar-row b{font:600 13px var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.note{font-size:12.5px;color:var(--muted);margin:0}
.cmp{display:grid;grid-template-columns:82px 1fr 1fr;font-size:13px;border-top:1px solid var(--line)}
.cmp > div{padding:9px 6px;border-bottom:1px solid var(--line);min-width:0;line-height:1.3}
.cmp .h{font:600 11px var(--mono);letter-spacing:.06em;text-transform:uppercase}
.cmp .h.p1{color:var(--priv)} .cmp .h.p2{color:var(--pub)}
.cmp .k{font:500 11px var(--mono);color:var(--muted);text-transform:uppercase;letter-spacing:.04em;padding-left:0}
.take{background:var(--surface);border-radius:16px;padding:20px;display:flex;flex-direction:column;gap:10px}
.take p.big-q{font:600 1.5rem/1.2 var(--display);margin:0;text-wrap:balance}
.take p{margin:0;color:var(--muted);font-size:14px}
.endnote{display:flex;gap:7px;align-items:center;justify-content:center;font-size:12px;color:var(--muted);padding-top:6px}
.endnote svg{width:13px;height:13px}

@media (prefers-reduced-motion: reduce){
  .card,.fill{transition:none} .screen,.bubble,.events li{animation:none}
}
</style>

</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Irshad Ltd.<span>MARKET GAME</span></div>
    <div class="pill" id="rolePill" hidden></div>
  </header>

  <!-- 1. Draw a card -->
  <section class="screen" id="s-draw">
    <div class="stack">
      <div class="eyebrow">Irshad Ltd. is raising money</div>
      <h1>Draw your investor card.</h1>
      <p class="lede">It's random. Once you draw, the card is yours for the whole game.</p>
    </div>
    <div class="deck" id="deck">
      <div class="card">
        <div class="face back"><div class="back-mark"><span>Investor card</span><b>Irshad Ltd.</b><span>Tap to draw</span></div></div>
        <div class="face front" id="cardFront"></div>
      </div>
    </div>
    <div class="locked-note" id="lockedNote" hidden></div>
    <div class="cta"><button class="btn btn-primary" id="mainBtn">Draw my card</button></div>
  </section>

  <!-- 2. The deal -->
  <section class="screen" id="s-info" hidden></section>

  <!-- 3. Time passes -->
  <section class="screen" id="s-sim" hidden></section>

  <!-- 4. Your result -->
  <section class="screen" id="s-result" hidden></section>

  <!-- 5. The other side -->
  <section class="screen" id="s-reveal" hidden></section>
</div>

<script>
(function(){
const KEY = 'irshad-game-role-v1';
const CAPITAL = { public: 10000, private: 250000 };
const BANK = 0.02;
const PUB_RET = 0.097;
const $ = s => document.querySelector(s);
const fmt = n => 'S$' + Math.round(n).toLocaleString('en-SG');
const pct = r => (r >= 0 ? '+' : '') + (r * 100).toFixed(r !== 0 && Math.abs(r) < 0.1 ? 1 : 0) + '%';
const sleep = ms => new Promise(r => setTimeout(r, ms));
function randn(){ let u=0,v=0; while(!u)u=Math.random(); while(!v)v=Math.random(); return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v); }

const I = {
  people:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="9" cy="8" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="9" r="2.4"/><path d="M16 14.2c2.9.4 5 2.7 5 5.8"/></svg>',
  lock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg>',
  pulse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><polyline points="3,12 7,12 10,5 14,19 17,12 21,12"/></svg>',
  door:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="6" y="3" width="12" height="18" rx="1"/><circle cx="14.5" cy="12" r="1" fill="currentColor"/></svg>',
  doc:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3h7l4 4v14H7z"/><path d="M14 3v4h4M10 12h5M10 16h5"/></svg>',
  eyeoff:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 3l18 18"/><path d="M10.6 6.1A9.8 9.8 0 0 1 12 6c5 0 9 6 9 6a15.6 15.6 0 0 1-3 3.4M6.6 7.6A15.4 15.4 0 0 0 3 12s4 6 9 6a9 9 0 0 0 4.4-1.2"/></svg>',
  exit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M10 4H5v16h5M14 8l4 4-4 4M18 12H9"/></svg>',
  clock:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  arrow:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>'
};

const ROLE = {
  public: {
    kind:'Card 4 of 5', who:'Public Investor', sub:'Retail investor with a brokerage app',
    foot:'Most people get this card.', odds:[1,1,1,1,0], pill:'Public',
    chips:[['people','Anyone can buy'],['pulse','Price every second'],['doc','Full disclosure'],['exit','Sell any day']]
  },
  private: {
    kind:'Card 1 of 5', who:'Private Investor', sub:'Accredited investor: over S$1M in financial assets',
    foot:'You were invited. Most people were not.', odds:[0,0,0,0,1], pill:'Private',
    chips:[['lock','Invite only'],['door','Price set in a room'],['eyeoff','Info for a chosen few'],['clock','Locked until exit']]
  }
};

const state = { role:null, choice:null, buyPrice:20, pubX:null, mult:null, outcome:null, result:null };

/* ---------- storage ---------- */
function load(){ try { return localStorage.getItem(KEY); } catch(e){ return null; } }
function save(r){ try { localStorage.setItem(KEY, r); } catch(e){} }
function clear(){ try { localStorage.removeItem(KEY); } catch(e){} }
const Q = (location.search + ' ' + location.hash).toLowerCase();
const FORCED = /[?&#]private\b/.test(Q) ? 'private' : /[?&#]public\b/.test(Q) ? 'public' : null;
if (FORCED || /[?&#]reset\b/.test(Q)) clear();

function show(id){
  document.querySelectorAll('.screen').forEach(s => s.hidden = (s.id !== id));
  window.scrollTo({top:0});
}

function applyRole(){
  document.body.dataset.role = state.role;
  const p = $('#rolePill');
  p.innerHTML = I.lock + ROLE[state.role].pill;
  p.hidden = false;
}

/* ---------- 1. draw ---------- */
function renderCard(){
  const R = ROLE[state.role];
  $('#cardFront').innerHTML = `
    <div>
      <div class="kind">${R.kind}</div>
      <div class="who">${R.who}</div>
      <div class="sub">${R.sub}</div>
    </div>
    <div>
      <div class="kind">Your money</div>
      <div class="cash">${fmt(CAPITAL[state.role])}</div>
      <div class="odds">${R.odds.map(o => `<i class="${o?'me':''}"></i>`).join('')}</div>
      <div class="foot">${R.foot}</div>
    </div>`;
}

const existing = load();
if (existing === 'public' || existing === 'private') {
  state.role = existing;
  renderCard(); applyRole();
  $('#deck').classList.add('flipped', 'settled');
  toDeal();
  $('#lockedNote').innerHTML = I.lock + 'You already drew this card. It stays with you.';
  $('#lockedNote').hidden = false;
}

async function draw(){
  if (state.role) return;
  state.role = FORCED || (Math.random() < 0.2 ? 'private' : 'public');
  save(state.role);
  renderCard();
  $('#mainBtn').disabled = true;
  $('#deck').classList.add('flipped');
  await sleep(950);
  $('#deck').classList.add('settled');
  applyRole();
  toDeal();
}
function toDeal(){
  const b = $('#mainBtn');
  b.disabled = false;
  b.innerHTML = 'See the deal' + I.arrow;
  b.onclick = () => { buildInfo(); show('s-info'); };
}
$('#mainBtn').onclick = draw;
$('#deck').addEventListener('click', draw);

/* ---------- 2. the deal ---------- */
let tickTimer = null;
function chipsHTML(){
  return `<div class="chips">${ROLE[state.role].chips.map(([ic,t]) => `<div class="chip">${I[ic]}<span>${t}</span></div>`).join('')}</div>`;
}

function buildInfo(){
  const el = $('#s-info');
  if (state.role === 'public') {
    el.innerHTML = `
      <div class="co">
        <div><h1>Irshad Ltd.</h1><div class="meta">SGX: IRSH · listed today</div></div>
        <div class="quote"><div class="px" id="px">S$20.00</div><div class="chg" id="chg">+0.00%</div></div>
      </div>
      <svg class="spark" id="spark" viewBox="0 0 300 56" preserveAspectRatio="none"><path class="area" id="sparkA"/><path class="ln" id="sparkL"/></svg>
      ${chipsHTML()}
      <div class="stack">
        <div class="label">Annual report · public filing</div>
        <div class="rows">
          <div class="row">Revenue<b>S$412M <span class="up">+9%</span></b></div>
          <div class="row">Net profit<b>S$38M</b></div>
          <div class="row">Price / earnings<b>24x</b></div>
          <div class="row">Dividend yield<b>1.8%</b></div>
        </div>
      </div>
      <div class="choices cta">
        <button class="btn btn-primary" id="yes">Buy ${fmt(CAPITAL.public)} of shares</button>
        <button class="btn btn-ghost" id="no">Keep it in the bank <small>(2%)</small></button>
      </div>`;
    startTicker();
  } else {
    el.innerHTML = `
      <div class="co">
        <div><h1>Irshad Ltd.</h1><div class="meta">Series B · private round</div></div>
        <div class="quote"><div class="px" style="font-size:1.05rem">No public price</div><div class="chg" style="color:var(--muted)">negotiated</div></div>
      </div>
      ${chipsHTML()}
      <div class="stack">
        <div class="label">Financials</div>
        <div class="rows">
          <div class="row">Revenue<span class="redact" style="width:74px"></span></div>
          <div class="row">Net profit<span class="redact" style="width:52px"></span></div>
          <div class="row">Valuation<span class="redact" style="width:64px"></span></div>
        </div>
        <div class="lockline">${I.lock}Shared only with chosen buyers</div>
      </div>
      <div class="stack">
        <div class="label">What you hear</div>
        <div class="whispers" id="whispers"></div>
      </div>
      <div class="choices cta">
        <button class="btn btn-primary" id="yes">Invest ${fmt(CAPITAL.private)} <small>(locked until exit)</small></button>
        <button class="btn btn-ghost" id="no">Pass, keep it in the bank <small>(2%)</small></button>
      </div>`;
    whisper();
  }
  $('#yes').addEventListener('click', () => decide('invest'));
  $('#no').addEventListener('click', () => decide('bank'));
}

async function whisper(){
  const lines = [
    ['Founder, over dinner','We are aiming to list on SGX in about three years.'],
    ['Lead VC partner','Two sovereign funds are in this round. Allocation is tight.'],
    ['Board member','Revenue doubled last year. Please keep the deck to yourself.']
  ];
  for (const [from, text] of lines) {
    await sleep(700);
    const box = $('#whispers'); if (!box) return;
    const b = document.createElement('div');
    b.className = 'bubble';
    b.innerHTML = `<span class="from">${from}</span>${text}`;
    box.appendChild(b);
  }
}

function startTicker(){
  let p = 20, hist = [20];
  const draw = () => {
    const L = $('#sparkL'); if (!L) return;
    const mn = Math.min(...hist) - .05, mx = Math.max(...hist) + .05;
    const pts = hist.map((v,i) => [i/(39)*300, 52 - (v-mn)/(mx-mn)*48]);
    const d = pts.map((q,i) => (i?'L':'M') + q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join(' ');
    L.setAttribute('d', d);
    $('#sparkA').setAttribute('d', d + ` L${pts[pts.length-1][0].toFixed(1)} 56 L0 56 Z`);
  };
  draw();
  tickTimer = setInterval(() => {
    const prev = p;
    p = p * Math.exp(randn() * 0.007) + (20 - p) * 0.06;
    hist.push(p); if (hist.length > 40) hist.shift();
    const px = $('#px'); if (!px) return;
    px.textContent = 'S$' + p.toFixed(2);
    px.classList.remove('flash-up','flash-down');
    void px.offsetWidth;
    px.classList.add(p >= prev ? 'flash-up' : 'flash-down');
    const c = p/20 - 1, chg = $('#chg');
    chg.textContent = (c>=0?'+':'') + (c*100).toFixed(2) + '%';
    chg.className = 'chg ' + (c >= 0 ? 'up' : 'down');
    state.buyPrice = p;
    draw();
  }, 650);
}

function decide(choice){
  clearInterval(tickTimer);
  state.choice = choice;
  show('s-sim');
  if (choice === 'bank') simBank();
  else if (state.role === 'public') simPublic();
  else simPrivate();
}

/* ---------- chart helpers ---------- */
const W = 320, H = 170, PAD = {l:6, r:52, t:14, b:24};
function scales(xd, yd){
  const x = v => PAD.l + (v - xd[0]) / (xd[1] - xd[0]) * (W - PAD.l - PAD.r);
  const y = v => H - PAD.b - (v - yd[0]) / (yd[1] - yd[0]) * (H - PAD.t - PAD.b);
  return {x, y};
}
const pathOf = (pts, s) => pts.map((p,i) => (i?'L':'M') + s.x(p[0]).toFixed(1) + ' ' + s.y(p[1]).toFixed(1)).join(' ');

function genPublicPath(N = 52, target = Math.log(1 + PUB_RET)){
  let X;
  for (let t = 0; t < 300; t++) {
    const Wk = [0];
    for (let i = 1; i <= N; i++) Wk.push(Wk[i-1] + randn() * 0.042);
    X = Wk.map((w,i) => w - i/N * Wk[N] + i/N * target);
    const mn = Math.min(...X), mx = Math.max(...X);
    if (mn < -0.1 && mx > 0.06) return X;
  }
  return X;
}

function simShell(title, sub){
  $('#s-sim').innerHTML = `
    <div class="stack"><div class="eyebrow">${sub}</div><h1>${title}</h1></div>
    <div class="bigrow"><div class="big" id="val"></div><div class="delta" id="dl"></div></div>
    <div class="clock" id="clk"></div>
    <svg class="chart" id="ch" viewBox="0 0 ${W} ${H}"></svg>
    <ul class="events" id="ev"></ul>
    <div class="cta"><button class="btn btn-primary" id="act"></button></div>`;
}

function setVal(v, start){
  $('#val').textContent = fmt(v);
  const r = v/start - 1, dl = $('#dl');
  dl.textContent = pct(r);
  dl.className = 'delta ' + (r >= 0 ? 'up' : 'down');
}

/* ---------- 3a. public: one bumpy year ---------- */
function simPublic(){
  simShell('One year on the market', 'You bought at S$' + state.buyPrice.toFixed(2));
  const start = CAPITAL.public, p0 = state.buyPrice;
  const X = genPublicPath(); state.pubX = X;
  const prices = X.map(x => p0 * Math.exp(x));
  const mn = Math.min(...prices), mx = Math.max(...prices), pad = (mx - mn) * 0.12;
  const s = scales([0,52], [mn - pad, mx + pad]);
  const ch = $('#ch');
  ch.innerHTML = `
    <line class="axis" x1="${PAD.l}" x2="${W-PAD.r}" y1="${H-PAD.b}" y2="${H-PAD.b}"/>
    <line class="base" x1="${PAD.l}" x2="${W-PAD.r}" y1="${s.y(p0)}" y2="${s.y(p0)}"/>
    <text class="lbl" x="${W-PAD.r+6}" y="${s.y(p0)+4}">bought</text>
    <path class="area" id="ar"/><path class="ln" id="ln"/>
    <circle class="dot" id="hd" r="4.5"/>
    <text class="lbl-strong" id="hl"></text>
    ${[0,3,6,9,12].map(m => `<text class="lbl" x="${s.x(m/12*52)}" y="${H-6}" text-anchor="${m===0?'start':m===12?'end':'middle'}">${m===0?'IPO':m+'m'}</text>`).join('')}`;
  const act = $('#act');
  act.innerHTML = I.exit + 'Sell now';
  act.className = 'btn btn-ghost';
  $('#ev').innerHTML = `<li><span>LIQUID</span>You can sell at any moment. Everyone sees the same price.</li>`;
  const DUR = 9000; let t0 = null, done = false, idx = 0;
  const render = i => {
    const pts = prices.slice(0, i+1).map((v,k) => [k, v]);
    const d = pathOf(pts, s);
    $('#ln').setAttribute('d', d);
    $('#ar').setAttribute('d', d + ` L${s.x(i).toFixed(1)} ${H-PAD.b} L${s.x(0)} ${H-PAD.b} Z`);
    const hx = s.x(i), hy = s.y(prices[i]);
    const hd = $('#hd'); hd.setAttribute('cx', hx); hd.setAttribute('cy', hy);
    const hl = $('#hl'); hl.setAttribute('x', hx + 8); hl.setAttribute('y', hy + 4); hl.textContent = 'S$' + prices[i].toFixed(2);
    setVal(start * prices[i] / p0, start);
    $('#clk').textContent = 'Month ' + Math.min(12, Math.ceil(i/52*12)) + ' of 12';
  };
  const finish = (i, sold) => {
    if (done) return; done = true;
    render(i);
    const end = start * prices[i] / p0;
    const r = end/start - 1;
    state.result = { start, end,
      verdict: sold ? (r < 0 ? 'You sold in a dip. Liquidity let you out, at a loss.' : 'You sold early and kept a small gain.')
                    : 'A bumpy year for a small gain.',
      sub: sold ? 'You sold in month ' + Math.max(1, Math.ceil(i/52*12)) + '. Public markets let you leave whenever you want.'
                : 'You could have sold any day. Everyone saw the same price and the same reports.' };
    act.className = 'btn btn-primary'; act.innerHTML = 'See my result' + I.arrow;
    act.onclick = () => showResult();
  };
  act.onclick = () => finish(idx, true);
  const step = ts => {
    if (done) return;
    if (t0 === null) t0 = ts;
    idx = Math.min(52, Math.floor((ts - t0) / DUR * 52));
    render(idx);
    if (idx >= 52) finish(52, false); else requestAnimationFrame(step);
  };
  render(0);
  requestAnimationFrame(step);
}

/* ---------- 3b. private: locked until exit ---------- */
async function simPrivate(){
  simShell('Waiting for an exit', 'Series B · you are in');
  const start = CAPITAL.private;
  const win = Math.random() < 0.85;
  const mult = win ? +(1.8 + Math.random() * 0.7).toFixed(2) : 0.3;
  const cMult = win ? +(1 + (mult - 1) * 0.45).toFixed(2) : 0.8;
  state.mult = mult; state.outcome = win ? 'win' : 'loss';
  const s = scales([0,3], [0, Math.max(2.7, mult + 0.3)]);
  const ch = $('#ch');
  ch.innerHTML = `
    <line class="axis" x1="${PAD.l}" x2="${W-PAD.r}" y1="${H-PAD.b}" y2="${H-PAD.b}"/>
    <line class="base" x1="${PAD.l}" x2="${W-PAD.r}" y1="${s.y(1)}" y2="${s.y(1)}"/>
    <text class="lbl" x="${W-PAD.r+6}" y="${s.y(1)+4}">you paid</text>
    <g id="segs"></g><g id="pts"></g>
    ${[0,1,2,3].map(y => `<text class="lbl" x="${s.x(y)}" y="${H-6}" text-anchor="${y===0?'start':y===3?'end':'middle'}">${y===0?'Today':'Year '+y}</text>`).join('')}`;
  const act = $('#act');
  act.disabled = true; act.className = 'btn btn-ghost';
  act.innerHTML = I.lock + 'Locked until exit';
  const seg = (a, b) => $('#segs').insertAdjacentHTML('beforeend', `<path class="ln guess" d="${pathOf([a,b], s)}"/>`);
  const dot = (p, label) => $('#pts').insertAdjacentHTML('beforeend',
    `<circle class="dot" r="5" cx="${s.x(p[0])}" cy="${s.y(p[1])}"/><text class="lbl-strong" x="${s.x(p[0])}" y="${s.y(p[1]) - 10}" text-anchor="${p[0]===3?'end':'middle'}">${label}</text>`);
  const ev = (when, text) => $('#ev').insertAdjacentHTML('beforeend', `<li><span>${when}</span>${text}</li>`);

  dot([0,1], '1.0x'); setVal(start, start); $('#clk').textContent = 'Year 0 · funds wired';
  ev('YEAR 0', `You wire ${fmt(start)}. You cannot sell it.`);
  await sleep(1700);
  $('#pts').insertAdjacentHTML('beforeend', `<circle class="ring" r="6" cx="${s.x(1)}" cy="${s.y(1)}"/><text class="lbl" x="${s.x(1)}" y="${s.y(1)-12}" text-anchor="middle">?</text>`);
  $('#clk').textContent = 'Year 1 · no price update';
  $('#val').textContent = 'No price'; $('#dl').textContent = '';
  ev('YEAR 1', 'Investor letter says "strong year". No price is shared.');
  await sleep(1800);
  seg([0,1], [2,cMult]); dot([2,cMult], cMult.toFixed(1) + 'x');
  setVal(start * cMult, start); $('#clk').textContent = 'Year 2 · paper value only';
  ev('YEAR 2', win ? `Series C values the company higher. You still cannot sell.` : 'Series C is delayed. A lower valuation is rumoured.');
  await sleep(1900);
  seg([2,cMult], [3,mult]); dot([3,mult], mult.toFixed(1) + 'x');
  setVal(start * mult, start); $('#clk').textContent = 'Year 3 · exit';
  ev('YEAR 3', win ? `IPO on SGX. Your stake is worth ${mult.toFixed(1)}x what you paid.` : 'Growth stalled. Sold to a rival for 0.3x what you paid.');
  state.result = { start, end: start * mult,
    verdict: win ? 'Three years locked in, then a big payout.' : 'Locked in, with no way out. The deal went bad.',
    sub: win ? 'You could not sell or even see a price along the way. The growth happened before ordinary investors could buy.'
             : 'Private deals can fall a long way, and you cannot sell early to cut the loss.' };
  act.disabled = false; act.className = 'btn btn-primary';
  act.innerHTML = 'See my result' + I.arrow;
  act.onclick = () => showResult();
}

/* ---------- 3c. bank ---------- */
function simBank(){
  simShell('Your cash sits in the bank', 'You passed on the deal');
  const start = CAPITAL[state.role];
  const s = scales([0,12], [0.9, 1.1]);
  const ch = $('#ch');
  ch.innerHTML = `
    <line class="axis" x1="${PAD.l}" x2="${W-PAD.r}" y1="${H-PAD.b}" y2="${H-PAD.b}"/>
    <path class="ln" id="ln"/><circle class="dot" id="hd" r="4.5"/>
    <text class="lbl" x="${PAD.l}" y="${H-6}">Today</text><text class="lbl" x="${W-PAD.r}" y="${H-6}" text-anchor="end">1 year</text>`;
  $('#ev').innerHTML = `<li><span>SAFE</span>Fixed interest. No surprises, no upside.</li>`;
  const act = $('#act'); act.disabled = true; act.className = 'btn btn-ghost'; act.textContent = 'Earning interest…';
  const DUR = 2600; let t0 = null;
  const step = ts => {
    if (t0 === null) t0 = ts;
    const k = Math.min(1, (ts - t0) / DUR);
    const pts = [[0,1],[12*k, 1 + BANK*k]];
    $('#ln').setAttribute('d', pathOf(pts, s));
    $('#hd').setAttribute('cx', s.x(12*k)); $('#hd').setAttribute('cy', s.y(1 + BANK*k));
    setVal(start * (1 + BANK*k), start);
    $('#clk').textContent = 'Month ' + Math.round(12*k) + ' of 12';
    if (k < 1) return requestAnimationFrame(step);
    state.result = { start, end: start * (1 + BANK), verdict: 'Safe and steady.',
      sub: state.role === 'private' ? 'You had the invitation and chose not to use it.' : 'You avoided the swings, and the gains.' };
    act.disabled = false; act.className = 'btn btn-primary'; act.innerHTML = 'See my result' + I.arrow;
    act.onclick = () => showResult();
  };
  requestAnimationFrame(step);
}

/* ---------- 4. result ---------- */
function showResult(){
  const R = state.result, r = R.end / R.start - 1;
  $('#s-result').innerHTML = `
    <div class="stack"><div class="eyebrow">Your result · ${ROLE[state.role].who}</div></div>
    <div class="result-card">
      <div class="label">You end with</div>
      <div class="big">${fmt(R.end)}</div>
      <div class="delta ${r>=0?'up':'down'}" style="font-size:18px">${pct(r)}</div>
      <div class="fromto">Started with ${fmt(R.start)}</div>
    </div>
    <p class="verdict">${R.verdict}</p>
    <p class="lede">${R.sub}</p>
    <div class="cta"><button class="btn btn-primary" id="toReveal">See the other side${I.arrow}</button></div>`;
  show('s-result');
  $('#toReveal').addEventListener('click', showReveal);
}

/* ---------- 5. the other side ---------- */
function showReveal(){
  const m = (state.role === 'private' && state.outcome === 'win') ? state.mult : 2.3;
  const c = 1 + (m - 1) * 0.45;
  const p0 = state.buyPrice || 20;
  const X = state.pubX || genPublicPath();
  const sb = p0 / m;
  const priv = [[0,sb],[1,sb*c],[2,p0]];
  const pub = X.map((x,i) => [2 + i/52, p0 * Math.exp(x)]);
  const ymax = Math.max(...pub.map(q => q[1])) * 1.28;
  const s = scales([0,3], [0, ymax]);
  const pubEnd = PUB_RET;
  const isPub = state.role === 'public';
  const head = isPub ? 'Most of the growth happened before you were allowed in.' : 'Most of the room never got this offer.';
  const sub = isPub
    ? `Invited investors bought the same Irshad Ltd. shares privately at S$${sb.toFixed(2)}. You could only buy after the IPO, at S$${p0.toFixed(2)}.`
    : `About 4 in 5 classmates could only buy after the IPO, at S$${p0.toFixed(2)}. You got in at S$${sb.toFixed(2)}.`;

  $('#s-reveal').innerHTML = `
    <div class="stack">
      <div class="eyebrow">The other side</div>
      <h1>${head}</h1>
      <p class="lede">${sub}</p>
    </div>
    <svg class="chart" id="rv" viewBox="0 0 ${W} ${H}">
      <rect class="zone-priv" x="${s.x(0)}" y="${PAD.t-8}" width="${s.x(2)-s.x(0)}" height="${H-PAD.b-PAD.t+8}"/>
      <rect class="zone-pub" x="${s.x(2)}" y="${PAD.t-8}" width="${s.x(3)-s.x(2)}" height="${H-PAD.b-PAD.t+8}"/>
      <text class="zone-lbl-priv" x="${s.x(0)+6}" y="${PAD.t+6}">PRIVATE · INVITE ONLY</text>
      <text class="zone-lbl-pub" x="${s.x(2)+5}" y="${PAD.t+6}">PUBLIC</text>
      <text class="gain-priv" x="${s.x(0.95)}" y="${PAD.t+32}" text-anchor="middle">+${Math.round((m-1)*100)}%</text>
      <text class="gain-pub" x="${s.x(2.5)}" y="${PAD.t+32}" text-anchor="middle">${pct(PUB_RET)}</text>
      <line class="axis" x1="${PAD.l}" x2="${s.x(3)}" y1="${H-PAD.b}" y2="${H-PAD.b}"/>
      <path class="ln-priv" id="rvA" d="${pathOf(priv, s)}"/>
      <path class="ln-pub" id="rvB" d="${pathOf(pub, s)}"/>
      ${priv.map(p => `<circle class="dot-priv" r="4.5" cx="${s.x(p[0])}" cy="${s.y(p[1])}"/>`).join('')}
      <text class="lbl-strong" x="${s.x(0)+2}" y="${s.y(sb)-10}">S$${sb.toFixed(2)}</text>
      <text class="lbl-strong" x="${s.x(3)+6}" y="${s.y(pub[pub.length-1][1])+4}">S$${pub[pub.length-1][1].toFixed(2)}</text>
      ${[['Series B',0],['Series C',1],['IPO',2],['+1 yr',3]].map(([t,v]) => `<text class="lbl" x="${s.x(v)}" y="${H-6}" text-anchor="${v===0?'start':'middle'}">${t}</text>`).join('')}
    </svg>

    <div class="stack">
      <div class="label">Same company, different returns</div>
      <div class="bars">
        <div class="bar-row"><span>Private, invited</span><div class="track"><div class="fill" style="background:var(--priv)" data-w="100"></div></div><b>+${Math.round((m-1)*100)}%</b></div>
        <div class="bar-row"><span>Public, after IPO</span><div class="track"><div class="fill" style="background:var(--pub)" data-w="${(pubEnd/(m-1)*100).toFixed(1)}"></div></div><b>${pct(PUB_RET)}</b></div>
        <div class="bar-row"><span>Bank</span><div class="track"><div class="fill" style="background:var(--muted)" data-w="${(BANK/(m-1)*100).toFixed(1)}"></div></div><b>+2%</b></div>
      </div>
      <p class="note">Private deals in this game also had a 15% chance of losing 70%, with no way to sell early.</p>
    </div>

    <div class="stack">
      <div class="label">Two markets, two jobs</div>
      <div class="cmp">
        <div></div><div class="h p1">Private</div><div class="h p2">Public</div>
        <div class="k">Who buys</div><div>Investors the company picks</div><div>Anyone</div>
        <div class="k">Price</div><div>Negotiated in a room</div><div>Set by the market, daily</div>
        <div class="k">Info</div><div>Shared with chosen buyers</div><div>Disclosed to everyone</div>
        <div class="k">Cash out</div><div>At exit, on their terms</div><div>Any trading day</div>
      </div>
    </div>

    <div class="take">
      <div class="eyebrow" style="color:var(--fg)">So, is private replacing public?</div>
      <p class="big-q">Not replacing. Growing alongside.</p>
      <p>Private markets now carry companies through the growth years. Public markets still give everyone a price, the information and the final exit. As the line between them blurs, wider access needs safeguards that grow with it.</p>
    </div>
    <div class="endnote">${I.lock}Your ${ROLE[state.role].pill.toLowerCase()} card stays locked on this device.</div>`;
  show('s-reveal');

  // draw the line in two acts: private years, then the public year
  const A = $('#rvA'), B = $('#rvB');
  const reduce = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  [[A,0,1200],[B,1200,1100]].forEach(([p, delay, dur]) => {
    const L = p.getTotalLength();
    if (reduce) return;
    p.style.strokeDasharray = L; p.style.strokeDashoffset = L;
    p.getBoundingClientRect();
    p.style.transition = `stroke-dashoffset ${dur}ms ease ${delay}ms`;
    p.style.strokeDashoffset = 0;
  });
  setTimeout(() => document.querySelectorAll('.fill').forEach(f => f.style.width = f.dataset.w + '%'), reduce ? 0 : 400);
}
})();
</script>
